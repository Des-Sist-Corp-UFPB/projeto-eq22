# Bounds Spring's test ApplicationContext cache. Read only by Spring's SpringProperties mechanism
# (classpath:spring.properties), never by the application itself: this file lives under
# src/test/resources, so it is absent from the packaged jar and has zero effect at runtime.
#
# Root cause this addresses: the backend suite spans many distinct Spring context configurations
# (different @DynamicPropertySource methods, different @Import'd CurrentUserTestConfiguration
# classes per tenant-isolation test). Spring's default cache size is 32, and each cached context
# keeps its own Hikari pool (spring.datasource.hikari.maximum-pool-size=4 in tests) open for as
# long as it stays cached. At the default cap, that is up to 32 x 4 = 128 simultaneous Postgres
# connections - over the 100-connection default of the CI postgres:16 service (no override in
# .github/workflows/ci.yml), so a full run intermittently fails with
# "FATAL: sorry, too many clients already" once enough distinct contexts accumulate.
#
# Reproduced locally against a throwaway postgres:16 container with default settings (matching CI
# exactly, unlike the project's usual local test containers which run with a much higher
# max_connections and never surface this): the failure reproduced deterministically, and was gone
# after this change, across a full 512-test run.
#
# 10 x 4 = 40 simultaneous connections at worst, comfortably under 100. Test semantics are
# unaffected: a context evicted from the cache is simply rebuilt on next use, exactly like the
# first time any test needs it.
spring.test.context.cache.maxSize=10
