spring:
  http:
    client:
      connect-timeout: ${OPENAI_CONNECT_TIMEOUT:5s}
      read-timeout: ${OPENAI_READ_TIMEOUT:60s}
  ai:
    model:
      chat: ${SPRING_AI_MODEL_CHAT:none}
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none

    retry:
      max-attempts: 2

    # branch feature/umami-mcp (#128): servidor MCP desabilitado por padrão.
    mcp:
      server:
        enabled: ${IWRITE_MCP_ENABLED:false}
        name: iwrite-mcp
        version: 0.0.1

    openai:
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      api-key: ${OPENAI_API_KEY:}

      chat:
        completions-path: ${OPENAI_COMPLETIONS_PATH:/v1/chat/completions}
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
  application:
    name: iwrite-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/iwrite}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: ${SERVER_PORT:8085}
  servlet:
    session:
      timeout: ${IWRITE_SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        # Lax is correct for the current topology: the browser origin and the API differ only by
        # port, and ports are not part of a "site", so the cookie is still sent. Set to none only
        # if the API ever moves to a different registrable domain — and that requires secure=true.
        same-site: lax
        # Must be true wherever the app is served over HTTPS.
        secure: ${IWRITE_COOKIE_SECURE:false}

logging:
  level:
    org.springframework.ai.converter.BeanOutputConverter: OFF
    org.springframework.ai.retry.autoconfigure.SpringAiRetryAutoConfiguration: OFF
  pattern:
    # Renderiza o llmExecutionId (UUID da linha de auditoria da execução LLM)
    # apenas na linha do console: o Java Agent exporta a mensagem formatada, não
    # o padrão do appender, então isto não vaza para o OTLP — e a captura de MDC
    # do agente continua desabilitada de propósito. O %replace remove os
    # colchetes vazios nas linhas que não têm o MDC.
    # Ver docs/otel-correlated-logs.md.
    level: "%5p %replace([%X{llmExecutionId:-}]){'\\[\\]',''}"

iwrite:
  mcp:
    scene-analysis:
      max-per-window: ${IWRITE_MCP_SCENE_ANALYSIS_MAX_PER_WINDOW:3}
      window: ${IWRITE_MCP_SCENE_ANALYSIS_WINDOW:1m}
  ai:
    audit:
      pricing:
        enabled: ${IWRITE_AI_PRICING_ENABLED:false}
        currency: ${IWRITE_AI_PRICING_CURRENCY:USD}
    openai:
      chat:
        options:
          temperature: ${OPENAI_TEMPERATURE:}
          max-tokens: ${OPENAI_MAX_TOKENS:}
          max-completion-tokens: ${OPENAI_MAX_COMPLETION_TOKENS:}
          reasoning-effort: ${OPENAI_REASONING_EFFORT:}
  demo:
    # Read only when the `demo` profile is active as well. Both passwords are required once the
    # seed is enabled and deliberately have no defaults: a default password in a repository is a
    # published password.
    seed:
      enabled: ${IWRITE_DEMO_SEED_ENABLED:false}
      autor-a-password: ${IWRITE_DEMO_AUTOR_A_PASSWORD:}
      autor-b-password: ${IWRITE_DEMO_AUTOR_B_PASSWORD:}
  auth:
    # Off by default. Sets the login credential for one existing user (never creates one); used to
    # unlock the documented development workflow and to roll an existing installation forward past
    # V30. No default email or password: unset all three again once the credential is provisioned.
    credential-provisioning:
      enabled: ${IWRITE_CREDENTIAL_PROVISIONING_ENABLED:false}
      email: ${IWRITE_CREDENTIAL_PROVISIONING_EMAIL:}
      password: ${IWRITE_CREDENTIAL_PROVISIONING_PASSWORD:}
    # Peers allowed to supply X-Forwarded-For/Forwarded for the login rate limiter's origin
    # dimension; see ClientAddressResolver. Comma-separated IPs, CIDRs, or hostnames (resolved by
    # DNS on every check). Empty by default: no peer is trusted and the TCP peer address is always
    # used. In the Compose topology, the frontend container is the only hop between the browser and
    # this backend, so it is the only entry set below.
    trusted-proxies: ${IWRITE_AUTH_TRUSTED_PROXIES:}
    # Bounded in-memory login throttling; see LoginRateLimiter. A single instance's own memory —
    # multiple replicas need a shared store to enforce one combined limit.
    login-rate-limit:
      max-attempts-per-origin: ${IWRITE_LOGIN_RATE_LIMIT_MAX_PER_ORIGIN:20}
      max-attempts-per-account: ${IWRITE_LOGIN_RATE_LIMIT_MAX_PER_ACCOUNT:8}
      max-tracked-keys: ${IWRITE_LOGIN_RATE_LIMIT_MAX_TRACKED_KEYS:10000}
      window: ${IWRITE_LOGIN_RATE_LIMIT_WINDOW:1m}
    # Own budget for POST /api/auth/register; see RegistrationRateLimiter. Origin only — a
    # registration always targets a brand-new email, so an account dimension would not add
    # protection an origin dimension does not already provide.
    registration-rate-limit:
      max-attempts-per-origin: ${IWRITE_REGISTRATION_RATE_LIMIT_MAX_PER_ORIGIN:10}
      max-tracked-keys: ${IWRITE_REGISTRATION_RATE_LIMIT_MAX_TRACKED_KEYS:10000}
      window: ${IWRITE_REGISTRATION_RATE_LIMIT_WINDOW:1m}
  current-user:
    development:
      enabled: ${IWRITE_DEVELOPMENT_CURRENT_USER_ENABLED:false}
      user-id: ${IWRITE_DEVELOPMENT_CURRENT_USER_ID:00000000-0000-0000-0000-000000000002}
      tenant-id: ${IWRITE_DEVELOPMENT_TENANT_ID:00000000-0000-0000-0000-000000000001}
      time-zone-id: ${IWRITE_DEVELOPMENT_TIME_ZONE_ID:America/Sao_Paulo}
