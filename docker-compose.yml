services:
  db:
    image: postgres:16
    container_name: iwrite-db
    environment:
      POSTGRES_DB: iwrite
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - iwrite_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d iwrite"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iwrite-backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/iwrite
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SERVER_PORT: 8085
      # Off, so identity comes from the session and each user resolves to their own tenant.
      # Leaving it on would register the fixed development identity instead, and every logged-in
      # user would land in the same workspace. Accounts to log in with come from the demo overlay
      # (docker-compose.demo.yml); this file alone starts an environment with no accounts.
      IWRITE_DEVELOPMENT_CURRENT_USER_ENABLED: "false"
      # Explícito porque o proxy do Next repassa o header Origin do navegador: mesmo com chamadas
      # de mesma origem, o backend continua aplicando CORS e responde 403 se a origem real do
      # frontend não estiver aqui.
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8085:8085"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # Needed at build time: next build bakes the rewrite destination into the routes manifest.
        BACKEND_ORIGIN: http://backend:8085
    container_name: iwrite-frontend
    environment:
      # The browser talks only to the frontend origin; Next rewrites /api to the backend over the
      # compose network, so the session cookie stays same-site. Kept at runtime as well, which is
      # what `next dev` reads.
      BACKEND_ORIGIN: http://backend:8085
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  iwrite_pgdata:
